# =========================================================
#  Khong co may tinh? Push project nay len GitHub, vao tab
#  Actions -> chay workflow -> tai Artifact (file .jar) ve.
# =========================================================
name: Build AutoBuilder

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: gradle build --no-daemon

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: AutoBuilder-jar
          path: build/libs/*.jar
