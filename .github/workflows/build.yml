name: Build AutoBuilder

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # JDK 25 chi dung de BIEN DICH. build.gradle van dat "release = 21"
      # nen file .jar tao ra chay binh thuong tren Java 21 cua Minecraft 1.21.11.
      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.9.2'

      - name: Kiem tra phien ban
        run: |
          java -version
          gradle --version

      - name: Build
        run: gradle build --no-daemon --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: AutoBuilder-jar
          path: build/libs/*.jar
