5name: Build AutoBuilder

6

7on:

8  workflow_dispatch:

9  push:

10    branches: [ main, master ]

11

12jobs:

13  build:

14    runs-on: ubuntu-latest

15    steps:

16      - name: Checkout

17        uses: actions/checkout@v4

18

19      - name: Setup JDK 25

20        uses: actions/setup-java@v4

21        with:

22          distribution: temurin

23          java-version: '25'

24

25      - name: Setup Gradle

26        uses: gradle/actions/setup-gradle@v4

27

28      - name: Make gradlew executable

29        run: chmod +x ./gradlew || true

30

31      - name: Build with Gradle

32        run: ./gradlew build --no-daemon || gradle build --no-daemon

33

34      - name: Upload jar

35        uses: actions/upload-artifact@v4

36        with:

37          name: AutoBuilder-jar

38          path: build/libs/*.jar

39